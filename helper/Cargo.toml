[package]
name = "dbknife-sqlite"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
rusqlite = { version = "0.43", default-features = false, features = [
    "bundled",
    "functions",
    "column_metadata",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
regex = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
