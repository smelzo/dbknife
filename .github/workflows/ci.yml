# Typecheck, unit tests and build on every push to main and on pull requests. The checks of the
# real app against test servers are run before each release. A push that changes only the site
# (published by pages.yml) skips it.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/pages.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # unit tests and the build do not start Electron
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
